# 测试 HTTPS 接收端：先运行 scripts/setup-document-sign-webhook.sh 生成本地秘密和证书。
spring.config.import=file:./.local/webhook/application.properties
webhook.document-sign.enabled=true
webhook.document-sign.timestamp-window=PT5M
server.address=0.0.0.0
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=file:./.local/webhook/receiver.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=document-sign-webhook
spring.h2.console.enabled=false
