spring.application.name=file-server

# Server
server.port=8080

# H2 file database: metadata (original name + storage path) lives here.
# AUTO_SERVER lets a second process (IDE + terminal) open the same file instead of
# failing with a confusing "database may be already in use" error.
spring.datasource.url=jdbc:h2:file:./data/file-server;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema is created/updated automatically on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Browse the data at http://localhost:8080/h2-console (JDBC URL above, user sa, empty password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Upload size limits.
# max-file-size caps a single file; max-request-size has to be larger because one
# request may carry several files at once. The page sends at most ~100MB per request,
# so 500MB leaves headroom without allowing an unbounded request body.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=500MB
