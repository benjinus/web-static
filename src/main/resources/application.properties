spring.application.name=file-server

# ---- 服务端口 ----
# 改成 0 可以随机分配端口，启动时会打印实际监听的地址
server.port=8080

# ---- H2 文件数据库：文件元数据（原始文件名、存储路径等）存放在这里 ----
# AUTO_SERVER=TRUE 允许同一份数据库文件被多个进程打开（例如 IDE 里跑一个、命令行再跑一个），
# 否则第二个进程会以 "Database may be already in use" 启动失败
spring.datasource.url=jdbc:h2:file:./data/file-server;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate ----
# update：启动时按实体自动建表/补列，改实体后重启即可生效（示例项目够用，生产建议用迁移工具）
spring.jpa.hibernate.ddl-auto=update
# 关闭 Open Session In View，避免把数据库连接一直占用到视图渲染结束
spring.jpa.open-in-view=false
# 想看 SQL 时改成 true
spring.jpa.show-sql=false

# ---- H2 控制台 ----
# 访问 http://localhost:8080/h2-console （JDBC URL 填上面的地址，用户名 sa，密码留空）
# 注意：Spring Boot 4 需要 spring-boot-h2console 依赖，控制台才会真正生效
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- 上传大小限制 ----
# max-file-size 限制单个文件；max-request-size 限制整个请求体，因为一个请求可能携带多个文件，
# 所以必须比 max-file-size 大。页面按 100MB 一批切分，正常情况下不会触到 500MB 这个上限。
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=500MB
